# =============================================================================
# 阻塞链分析（通用版）
# =============================================================================
# 分析指定时间范围内主线程的阻塞链：线程状态分布、唤醒链、阻塞函数分布。
# 与 anr_main_thread_blocking 不同，此技能不依赖 ANR 时间戳，
# 可用于任意时间范围的阻塞根因分析。
#
# 典型使用场景：
# - 滚动卡顿期间的主线程阻塞根因
# - 启动慢时某阶段的阻塞分析
# - 任意用户选定时间范围的诊断

name: blocking_chain_analysis
version: "1.2"
type: composite
category: diagnostics
tier: A

meta:
  display_name: "阻塞链分析"
  description: "分析指定时间范围内主线程的阻塞链：谁阻塞了主线程？唤醒者是谁？唤醒者在做什么？"
  icon: "link"
  tags: [blocking, waker, chain, root_cause, diagnostics]

prerequisites:
  required_tables:
    - thread_state
    - thread
    - process

inputs:
  - name: process_name
    type: string
    required: true
    description: "目标进程名"
  - name: start_ts
    type: timestamp
    required: true
    description: "分析起始时间戳(ns)"
  - name: end_ts
    type: timestamp
    required: true
    description: "分析结束时间戳(ns)"
  - name: min_wait_ms
    type: number
    required: false
    description: "多跳唤醒链追踪的最小等待时长(ms)"
  - name: max_hops
    type: number
    required: false
    description: "唤醒链最大跳数"
  - name: top_waits
    type: number
    required: false
    description: "追踪的等待区间数（按时长降序）"

identity:
  policy: required
  scope: process
  aliases: [process_name, package]
  rewriteTo: recommended_process_name_param

steps:
  # ==========================================================================
  # Step 1: 主线程状态分布
  # ==========================================================================
  - id: thread_state_distribution
    type: atomic
    name: "主线程状态分布"
    display:
      level: key
      layer: overview
      show: false
      title: "主线程状态分布（指定时间范围）"
      columns:
        - name: state
          label: "线程状态"
          type: string
        - name: state_display
          label: "状态说明"
          type: string
        - name: total_dur_ms
          label: "总时间(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: count
          label: "次数"
          type: number
          format: compact
        - name: pct
          label: "占比(%)"
          type: percentage
          format: percentage
        - name: blocked_function
          label: "主要阻塞函数"
          type: string
    synthesize:
      role: overview
      fields:
        - key: state_display
          label: 状态
        - key: pct
          label: 占比
          format: "{{value}}%"
        - key: total_dur_ms
          label: 总时间
          format: "{{value}} ms"
      insights:
        - condition: "state === 'S' && pct > 50"
          template: "主线程 {{pct}}% 时间处于 Sleep 状态，可能在等待锁或 Binder"
        - condition: "state === 'D' && pct > 20"
          template: "主线程 {{pct}}% 时间处于不可中断睡眠 (D)，需结合 io_wait/blocked_function 判断是否为 IO"
        - condition: "state === 'R' && pct > 80"
          template: "主线程 {{pct}}% 时间处于 Runnable/Running，CPU 争抢或繁忙"
    sql: |
      WITH main_thread AS ( -- 精确进程名优先（GLOB 前缀会带进 ${process_name}:subprocess）；存活线程优先；utid 兜底
        SELECT t.utid
        FROM thread t
        JOIN process p ON t.upid = p.upid
        WHERE (p.name = '${process_name}' OR p.name GLOB '${process_name}*')
          AND (t.is_main_thread = 1 OR t.tid = p.pid)
        ORDER BY
          (p.name = '${process_name}') DESC,
          EXISTS(SELECT 1 FROM thread_state ts WHERE ts.utid = t.utid) DESC,
          t.utid
        LIMIT 1
      ),
      state_dist AS (
        SELECT
          ts_tbl.state,
          COUNT(*) as count,
          SUM(
            MIN(ts_tbl.ts + ts_tbl.dur, ${end_ts})
            - MAX(ts_tbl.ts, ${start_ts})
          ) as total_dur_ns,
          -- 找到该状态下最常见的 blocked_function
          (SELECT bf.blocked_function
           FROM thread_state bf
           CROSS JOIN main_thread mt2
           WHERE bf.utid = mt2.utid
             AND bf.state = ts_tbl.state
             AND bf.blocked_function IS NOT NULL
             AND bf.blocked_function != ''
             AND bf.ts + bf.dur > ${start_ts}
             AND bf.ts < ${end_ts}
           GROUP BY bf.blocked_function
           ORDER BY SUM(bf.dur) DESC
           LIMIT 1
          ) as top_blocked_function
        FROM thread_state ts_tbl
        CROSS JOIN main_thread mt
        WHERE ts_tbl.utid = mt.utid
          AND ts_tbl.ts + ts_tbl.dur > ${start_ts}
          AND ts_tbl.ts < ${end_ts}
        GROUP BY ts_tbl.state
      ),
      total AS (
        SELECT SUM(total_dur_ns) as total_ns FROM state_dist
      )
      SELECT
        sd.state,
        CASE sd.state
          WHEN 'Running' THEN 'Running (运行中)'
          WHEN 'R' THEN 'Runnable (可运行)'
          WHEN 'R+' THEN 'Runnable (Preempted)'
          WHEN 'S' THEN 'Sleeping (睡眠/等待)'
          WHEN 'D' THEN 'Uninterruptible Sleep (不可中断睡眠)'
          WHEN 'T' THEN 'Stopped (已停止)'
          WHEN 'X' THEN 'Dead (已退出)'
          ELSE sd.state
        END as state_display,
        ROUND(sd.total_dur_ns / 1e6, 2) as total_dur_ms,
        sd.count,
        ROUND(100.0 * sd.total_dur_ns / NULLIF((SELECT total_ns FROM total), 0), 1) as pct,
        sd.top_blocked_function as blocked_function
      FROM state_dist sd
      ORDER BY total_dur_ns DESC
    save_as: thread_state_distribution

  # ==========================================================================
  # Step 2: 唤醒链分析
  # ==========================================================================
  - id: waker_chain
    type: atomic
    name: "唤醒链分析"
    display:
      level: key
      layer: list
      title: "主线程唤醒链（谁唤醒了主线程）"
      columns:
        - name: ts
          label: "唤醒时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: waker_thread_name
          label: "唤醒者线程"
          type: string
        - name: waker_process_name
          label: "唤醒者进程"
          type: string
        - name: blocked_function
          label: "阻塞函数"
          type: string
        - name: total_sleep_dur_ms
          label: "总 Sleep 时长(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: max_sleep_dur_ms
          label: "最大 Sleep 时长(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: wakeup_count
          label: "唤醒次数"
          type: number
          format: compact
    sql: |
      -- Perfetto 只把 waker_utid 记录在唤醒后的第一个 R/R+ 行上；S/D 等待行自身的
      -- waker_utid 为 NULL。因此把每个等待行回连到其结束时刻的后继行解析唤醒者；
      -- 同一结束时刻被拆成多行（R → R+）时用 MAX 收敛为一段等待一行。
      WITH main_thread AS (
        SELECT t.utid
        FROM thread t
        JOIN process p ON t.upid = p.upid
        WHERE (p.name = '${process_name}' OR p.name GLOB '${process_name}*')
          AND (t.is_main_thread = 1 OR t.tid = p.pid)
        ORDER BY
          (p.name = '${process_name}') DESC,
          EXISTS(SELECT 1 FROM thread_state ts WHERE ts.utid = t.utid) DESC,
          t.utid
        LIMIT 1
      ),
      waits AS (
        SELECT
          t.id AS state_id,
          t.ts + t.dur AS wakeup_ts,
          t.dur AS sleep_dur,
          t.blocked_function,
          MAX(w.waker_utid) AS waker_utid
        FROM thread_state t
        CROSS JOIN main_thread mt
        LEFT JOIN thread_state w
          ON w.utid = t.utid
          AND w.ts = t.ts + t.dur
          AND w.state IN ('R', 'R+')
          AND w.waker_utid IS NOT NULL
        WHERE t.utid = mt.utid
          AND t.state IN ('S', 'D')
          AND t.dur > 0
          AND t.ts + t.dur > ${start_ts}
          AND t.ts < ${end_ts}
        GROUP BY t.id
      )
      SELECT
        printf('%d', MIN(wakeup_ts)) as ts,
        wt.name as waker_thread_name,
        wp.name as waker_process_name,
        blocked_function,
        ROUND(SUM(sleep_dur) / 1e6, 2) as total_sleep_dur_ms,
        ROUND(MAX(sleep_dur) / 1e6, 2) as max_sleep_dur_ms,
        COUNT(*) as wakeup_count
      FROM waits
      JOIN thread wt ON wt.utid = waits.waker_utid
      LEFT JOIN process wp ON wt.upid = wp.upid
      GROUP BY wt.name, wp.name, blocked_function
      ORDER BY SUM(sleep_dur) DESC
      LIMIT 15
    save_as: waker_chain
    optional: true

  # ==========================================================================
  # Step 2.5: 多跳唤醒链追踪
  # ==========================================================================
  # 直接唤醒者往往自己也刚被唤醒（接力），真正干活的线程在链上游。
  # 沿"唤醒者的上一次被唤醒"向上递归，只计入发生在本等待窗口内的唤醒：
  # 链条自然终止于等待开始前已在运行的根部线程，或无观测唤醒者/跳数上限。
  - id: wakeup_chain_trace
    type: atomic
    name: "多跳唤醒链追踪"
    display:
      level: detail
      layer: list
      title: "主线程长等待的多跳唤醒链（谁最终唤醒了主线程）"
      columns:
        - name: wait_start_ts
          label: "等待开始"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: wait_ms
          label: "总等待(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: hop
          label: "跳数"
          type: number
          format: compact
        - name: waker_thread_name
          label: "该跳线程"
          type: string
        - name: waker_process_name
          label: "所属进程"
          type: string
        - name: waker_runnable_ts
          label: "该跳被唤醒时刻"
          type: timestamp
          unit: ns
        - name: waker_wait_before_ms
          label: "该跳此前等待(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: run_ms_in_wait
          label: "等待窗口内运行(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: chain_status
          label: "链状态"
          type: string
    sql: |
      WITH RECURSIVE main_thread AS (
        SELECT t.utid
        FROM thread t
        JOIN process p ON t.upid = p.upid
        WHERE (p.name = '${process_name}' OR p.name GLOB '${process_name}*')
          AND (t.is_main_thread = 1 OR t.tid = p.pid)
        ORDER BY
          (p.name = '${process_name}') DESC,
          EXISTS(SELECT 1 FROM thread_state ts WHERE ts.utid = t.utid) DESC,
          t.utid
        LIMIT 1
      ),
      waits AS (
        SELECT t.id AS wait_id, t.ts AS ws, t.ts + t.dur AS we
        FROM thread_state t
        CROSS JOIN main_thread mt
        WHERE t.utid = mt.utid
          AND t.state IN ('S', 'D')
          AND t.dur > ${min_wait_ms|10} * 1000000
          AND t.ts + t.dur > ${start_ts}
          AND t.ts < ${end_ts}
      ),
      top_waits AS (
        SELECT * FROM waits ORDER BY we - ws DESC LIMIT ${top_waits|8}
      ),
      chain AS (
        SELECT w.wait_id, w.ws, w.we, 1 AS depth, r.waker_utid AS hop_utid,
          (SELECT MAX(p0.ts) FROM thread_state p0
           WHERE p0.utid = r.waker_utid AND p0.state IN ('R', 'R+')
             AND p0.waker_utid IS NOT NULL AND p0.ts < r.ts) AS hop_own_wake_ts
        FROM top_waits w
        JOIN thread_state r
          ON r.utid = (SELECT utid FROM main_thread)
          AND r.ts = w.we
          AND r.state IN ('R', 'R+')
          AND r.waker_utid IS NOT NULL
        UNION ALL
        SELECT c.wait_id, c.ws, c.we, c.depth + 1, p.waker_utid AS hop_utid,
          (SELECT MAX(p2.ts) FROM thread_state p2
           WHERE p2.utid = p.waker_utid AND p2.state IN ('R', 'R+')
             AND p2.waker_utid IS NOT NULL AND p2.ts < p.ts) AS hop_own_wake_ts
        FROM chain c
        JOIN thread_state p
          ON p.utid = c.hop_utid
          AND p.ts = c.hop_own_wake_ts
          AND p.state IN ('R', 'R+')
          AND p.waker_utid IS NOT NULL
        WHERE c.depth < ${max_hops|6}
          AND c.hop_own_wake_ts IS NOT NULL
          AND c.hop_own_wake_ts > c.ws
      )
      SELECT
        printf('%d', c.ws) AS wait_start_ts,
        ROUND((c.we - c.ws) / 1e6, 2) AS wait_ms,
        c.depth AS hop,
        wt.name AS waker_thread_name,
        wp.name AS waker_process_name,
        CASE WHEN c.hop_own_wake_ts IS NOT NULL THEN printf('%d', c.hop_own_wake_ts) END AS waker_runnable_ts,
        ROUND(COALESCE((
          SELECT s.dur / 1e6 FROM thread_state s
          WHERE s.utid = c.hop_utid AND s.state IN ('S', 'D')
            AND s.ts + s.dur = c.hop_own_wake_ts
        ), 0), 2) AS waker_wait_before_ms,
        ROUND((
          SELECT COALESCE(SUM(MIN(r2.ts + r2.dur, c.we) - MAX(r2.ts, c.ws)), 0) / 1e6
          FROM thread_state r2
          WHERE r2.utid = c.hop_utid AND r2.state = 'Running'
            AND r2.ts < c.we AND r2.ts + r2.dur > c.ws
        ), 2) AS run_ms_in_wait,
        CASE
          WHEN c.hop_own_wake_ts IS NULL THEN 'end_no_waker'
          WHEN c.hop_own_wake_ts <= c.ws THEN 'end_root_before_window'
          WHEN c.depth >= ${max_hops|6} THEN 'end_depth_cap'
          ELSE 'relay'
        END AS chain_status
      FROM chain c
      JOIN thread wt ON wt.utid = c.hop_utid
      LEFT JOIN process wp ON wt.upid = wp.upid
      ORDER BY (c.we - c.ws) DESC, c.wait_id, c.depth
    save_as: wakeup_chain_trace
    optional: true

  # ==========================================================================
  # Step 3: 阻塞函数汇总
  # ==========================================================================
  - id: blocked_function_summary
    type: atomic
    name: "阻塞函数汇总"
    display:
      level: key
      layer: list
      title: "主线程阻塞函数分布 Top 10"
      columns:
        - name: blocked_function
          label: "阻塞函数"
          type: string
        - name: total_dur_ms
          label: "总阻塞时间(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: count
          label: "次数"
          type: number
          format: compact
        - name: pct
          label: "占比(%)"
          type: percentage
          format: percentage
    sql: |
      WITH main_thread AS (
        SELECT t.utid
        FROM thread t
        JOIN process p ON t.upid = p.upid
        WHERE (p.name = '${process_name}' OR p.name GLOB '${process_name}*')
          AND (t.is_main_thread = 1 OR t.tid = p.pid)
        ORDER BY
          (p.name = '${process_name}') DESC,
          EXISTS(SELECT 1 FROM thread_state ts WHERE ts.utid = t.utid) DESC,
          t.utid
        LIMIT 1
      ),
      blocked AS (
        SELECT
          ts_tbl.blocked_function,
          ts_tbl.dur
        FROM thread_state ts_tbl
        CROSS JOIN main_thread mt
        WHERE ts_tbl.utid = mt.utid
          AND ts_tbl.state IN ('S', 'D')
          AND ts_tbl.blocked_function IS NOT NULL
          AND ts_tbl.blocked_function != ''
          AND ts_tbl.ts + ts_tbl.dur > ${start_ts}
          AND ts_tbl.ts < ${end_ts}
      ),
      total AS (
        SELECT SUM(dur) as total_ns FROM blocked
      )
      SELECT
        blocked_function,
        ROUND(SUM(dur) / 1e6, 2) as total_dur_ms,
        COUNT(*) as count,
        ROUND(100.0 * SUM(dur) / NULLIF((SELECT total_ns FROM total), 0), 1) as pct
      FROM blocked
      GROUP BY blocked_function
      ORDER BY SUM(dur) DESC
      LIMIT 10
    save_as: blocked_function_summary
    optional: true

output:
  format: layered
  default_expanded: [thread_state_distribution, waker_chain, wakeup_chain_trace, blocked_function_summary]
