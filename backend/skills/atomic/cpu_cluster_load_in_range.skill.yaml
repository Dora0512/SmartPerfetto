# =============================================================================
# CPU 簇负载分析 (Composite Skill)
# =============================================================================
# 计算指定时间范围内各 CPU 簇（超大核/大核/中核/小核）的整体负载
# 负载 = Running 时间 / (非挂起时长 × 簇内核心数)
# 100% 表示该簇所有核心在设备醒着的时间里完全跑满
#
# v2.1: 分母对齐上游 android_cpu_cluster_utilization_in_interval (7af4ec945c)
#   - 核心数取 _cpu_topology 中该簇的全部核心，而不是窗口内跑过任务的核心；
#     旧算法在部分核心空闲时会把负载高估（空闲核心被排除出分母）
#   - 时长用 to_monotonic 扣除挂起时间；无时钟快照时回退墙钟时长
#   - 仍用 SmartPerfetto 自己的 _cpu_topology 分级（上游映射没有 prime 档、
#     会计入从未上线的核心、且不区分 machine）
#   - active_core_count 给出窗口内实际跑过任务的核心数，便于区分"空闲"与"离线"
#   - 拓扑无法分级时标为"未分类核心"，不再冒充小核簇
#
# v2.0: 重构为 composite skill，复用 _cpu_topology 视图
#   - 调用 cpu_topology_view 创建共享拓扑视图
#   - 主 SQL 通过 JOIN _cpu_topology 获取核心分类
#   - 支持 prime/big/medium/little 四级分类

name: cpu_cluster_load_in_range
version: "2.1"
type: composite
category: cpu
tier: B

meta:
  display_name: "CPU 簇负载分析"
  description: "计算大核簇和小核簇的整体 CPU 负载百分比（动态拓扑检测）"
  icon: "memory"
  tags: [cpu, cluster, load, atomic]

inputs:
  - name: start_ts
    type: timestamp
    required: true
    description: "分析起始时间戳(ns)"
  - name: end_ts
    type: timestamp
    required: true
    description: "分析结束时间戳(ns)"

steps:
  # ========== 初始化 CPU 拓扑视图（供后续步骤 JOIN）==========
  - id: init_cpu_topology
    type: skill
    name: "初始化 CPU 拓扑"
    skill: cpu_topology_view
    display:
      level: hidden
    optional: true

  # ========== 簇负载计算 ==========
  - id: cluster_load
    type: atomic
    process_scope:
      role: global_context
    name: "CPU 簇负载计算"
    optional: true
    display:
      level: detail
      layer: deep
      title: "CPU 簇负载"
      columns:
        - name: cluster
          label: "CPU 簇"
          type: string
        - name: core_count
          label: "核心数"
          type: number
        - name: active_core_count
          label: "活跃核心数"
          type: number
        - name: awake_ms
          label: "非挂起时长"
          type: duration
          format: duration_ms
          unit: ms
        - name: running_ms
          label: "Running 时间"
          type: duration
          format: duration_ms
          unit: ms
        - name: total_capacity_ms
          label: "总容量"
          type: duration
          format: duration_ms
          unit: ms
        - name: load_pct
          label: "负载"
          type: percentage
          format: percentage
        - name: idle_pct
          label: "空闲"
          type: percentage
          format: percentage
        - name: max_single_core_pct
          label: "最忙核心"
          type: percentage
          format: percentage
    sql: |
      WITH
      -- 分母 = 簇内全部核心 × 窗口内非挂起时长（与上游 7af4ec945c 同法）。
      -- to_monotonic 不计挂起时间；无时钟快照或结果越界时回退到墙钟时长。
      awake AS (
        SELECT IIF(monotonic_ns > 0 AND monotonic_ns <= wall_ns, monotonic_ns, wall_ns) AS awake_ns
        FROM (
          SELECT
            ${end_ts} - ${start_ts} AS wall_ns,
            to_monotonic(${end_ts}) - to_monotonic(${start_ts}) AS monotonic_ns
        )
      ),
      -- 核心数取自 _cpu_topology（trace 中实际出现过的核心），不再只数窗口内跑过任务的核心
      cluster_cores AS (
        SELECT core_type AS cluster_type, COUNT(DISTINCT cpu_id) AS core_count
        FROM _cpu_topology
        GROUP BY core_type
      ),
      cpu_running AS (
        SELECT
          ts.cpu,
          ct.core_type AS cluster_type,
          MIN(ts.ts + ts.dur, ${end_ts}) - MAX(ts.ts, ${start_ts}) AS clipped_dur
        FROM thread_state ts
        JOIN _cpu_topology ct ON ts.cpu = ct.cpu_id
        WHERE ts.ts < ${end_ts}
          AND ts.ts + ts.dur > ${start_ts}
          AND ts.state = 'Running'
          AND ts.cpu IS NOT NULL
      ),
      per_cpu_stats AS (
        SELECT
          cpu,
          cluster_type,
          SUM(CASE WHEN clipped_dur > 0 THEN clipped_dur ELSE 0 END) AS running_ns
        FROM cpu_running
        GROUP BY cpu, cluster_type
      ),
      cluster_stats AS (
        SELECT
          cc.cluster_type,
          cc.core_count,
          COUNT(pcs.cpu) AS active_core_count,
          COALESCE(SUM(pcs.running_ns), 0) AS total_running_ns,
          COALESCE(MAX(pcs.running_ns), 0) AS max_core_running_ns
        FROM cluster_cores cc
        LEFT JOIN per_cpu_stats pcs ON pcs.cluster_type = cc.cluster_type
        GROUP BY cc.cluster_type, cc.core_count
      )
      SELECT
        CASE cs.cluster_type
          WHEN 'prime' THEN '超大核簇'
          WHEN 'big' THEN '大核簇'
          WHEN 'medium' THEN '中核簇'
          WHEN 'little' THEN '小核簇'
          ELSE '未分类核心'
        END AS cluster,
        cs.core_count,
        cs.active_core_count,
        ROUND(a.awake_ns / 1e6, 2) AS awake_ms,
        ROUND(cs.total_running_ns / 1e6, 2) AS running_ms,
        ROUND(a.awake_ns * cs.core_count / 1e6, 2) AS total_capacity_ms,
        ROUND(100.0 * cs.total_running_ns / NULLIF(a.awake_ns * cs.core_count, 0), 1) AS load_pct,
        ROUND(100.0 - 100.0 * cs.total_running_ns / NULLIF(a.awake_ns * cs.core_count, 0), 1) AS idle_pct,
        ROUND(100.0 * cs.max_core_running_ns / NULLIF(a.awake_ns, 0), 1) AS max_single_core_pct
      FROM cluster_stats cs
      CROSS JOIN awake a
      ORDER BY CASE cs.cluster_type
        WHEN 'prime' THEN 0 WHEN 'big' THEN 1 WHEN 'medium' THEN 2 WHEN 'little' THEN 3 ELSE 4
      END
    save_as: cluster_load

output:
  format: structured
